sonar.projectKey=Quitch_GW-Server-Mods
sonar.organization=quitch
sonar.projectVersion=1.1.0
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Set explicitly: the default is the CI runner's platform charset, which would make
# whether a file decodes cleanly depend on the machine rather than the repo.
sonar.sourceEncoding=UTF-8

# Binary assets the scanner would otherwise try to read as UTF-8 text.
sonar.exclusions=**/*.png

# Coverage-metric exclusions. These files are still analysed for bugs and smells;
# only their lines-to-cover are dropped. Node-only tooling and the tests themselves
# are not shipped mod code. Every shipped ui/** file loads under the harness
# (scripts/lib/scene-loader.js) and is measured - see docs/testing.md.
sonar.coverage.exclusions=\
  scripts/**,\
  test/**
