version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns:
          - "*"
    ignore:
      # lodash is pinned to 3.9.3 to match the version the base game ships and
      # loads at runtime. It is a devDependency used only to stand in for the
      # game's global `_` under the Node test harness (scripts/lib/scene-loader.js)
      # - never shipped to players, so upstream lodash advisories do not apply.
      - dependency-name: "lodash"
      # eslint, @eslint/js and eslint-plugin-es-x are held on 9.x: eslint-plugin-lodash
      # calls context.getSourceCode, which ESLint 10 removed, and es-x 10.x requires
      # ESLint >= 10.6. A major bump of any of the three breaks lint.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-es-x"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
